<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Predictor!</title>
  </head>

<body>

<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->

<script src="https://code.jquery.com/jquery-3.3.1.min.js">
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>


<div class="container">
    <fieldset class="border p-2" id="step-1">
        <form id="submit-symbol" method="post" enctype="multipart/form-data">
            <legend class="w-auto">Step I</legend>
            <p>Enter the market symbol and days that you would like to run the forecaster for:</p>
            <div class="form-group">
                <label for="formGroupSymbolInput">Stock market symbol</label>
                <input type="text" class="form-control" id="formGroupSymbolInput" placeholder="CRM">
            </div>
            <div class="form-group">
                <label for="formGroupDaysInput">Forecast days in future</label>
                <input type="text" class="form-control" id="formGroupDaysInput" placeholder="30">
            </div>            
            <button type="submit" class="btn btn-primary">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none"></span>
                Forecast
            </button>
        </form>
    </fieldset>

    <fieldset class="border p-2" id="step-2" style="display: none;">
        <legend class="w-auto">Step II</legend>
        <div class="inner"><p id="forecast-img-nlg"></p></div>
        <img id="forecast-img" src="" alt="forecast graph" style="max-width: 100%"><br />
        <button id="start-again" class="btn btn-primary" type="button">Start Again</button>
    </fieldset>

</div>

<script>

function getAscendingRatio(trendArray) {
    // calculate the ascendingness of the array values
    var asc = 0;
    var arrayLength = trendArray.length;

    for (var i = 0; i < arrayLength; i++) {
        if (trendArray[i] <= trendArray[i+1]) {
            asc += 1;
        }
    }
  return asc/arrayLength;
}

$(function() {
    function submitSymbol(e) {
        e.preventDefault();
        var self = this;
        // Create a FormData object
        var form_data = new FormData($('#submit-symbol'));
        // Get symbol & days hyper-param
        var symb = $('#formGroupSymbolInput').val();
        var days_no = $('#formGroupDaysInput').val();
        if (days_no == '') {
            days_no = 30    // Default value
        }
        if(symb == ''){
            alert('You should set the stock market symbol.');
        } else {
            $(this).find('.spinner-border').show();
            form_data.append('symbol', symb);
            form_data.append('days', days_no);

            $.ajax({
                type: 'POST',
                url: 'http://127.0.0.1:5001/api/v1/forecast',
                data: form_data,
                contentType: false,
                cache: false,
                processData: false,
                success: function(response) {
                    console.log('Success!');
                    $('#step-1').hide();
                    // stop spinner
                    $(self).find('.spinner-border').hide();
                    // display forecast image
                    $("#forecast-img").attr("src", response.url);
                    trendArray = response.trend;
                    // console.log(trendArray);
                    var asc = getAscendingRatio(trendArray);
                    var desc = 1.0 - asc;
                    //console.log(asc);
                    if (asc > 0.9) {
                        $("#forecast-img-nlg").text("The following graph shows the forecast for " + symb.toUpperCase() + " over the next " + days_no + " days.  Our analysis suggests that you should buy this stock or hold if you have it.");
                    } else if (desc > 0.9) {
                        $("#forecast-img-nlg").text("The following graph shows the forecast for " + symb.toUpperCase() + " over the next " + days_no + " days.  Our analysis suggests that you should sell this stock if you own it or short it.");
                    } else {
                        $("#forecast-img-nlg").text("The following graph shows the forecast for " + symb.toUpperCase() + " over the next " + days_no + " days.  We don't recommend any actions at this time.");
                    }
                    $('#step-2').show();
                },
                error: function(xhr) {
                    // handle error
                    alert('Error occured while processing the request.  Try again later.');
                    $(self).find('.spinner-border').hide();
            }
            });
        }
    }

    $('form#submit-symbol').submit(submitSymbol);
 
    $('#start-again').click(function() {
        $('#step-2').hide();
        $('#step-1').show();
    });
});
</script>

</body>
</html>
